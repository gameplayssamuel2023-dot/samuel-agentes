<style>
  :root {
    --bg1: #e6eef7; --bg2: #f7ede9; --card: #ffffff; --ink: #16324f; --text: #1c2733; --muted: #55677b;
    --tobby: #dbe8f7; --lulu: #fde3d2; --leaf: #2f9e6e; --line: rgba(22,50,79,.12);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg1: #0b1620; --bg2: #1a1420; --card: #16222f; --ink: #2a5a8a; --text: #e8eef5; --muted: #9db0c4; --tobby: #20374f; --lulu: #4a3427; --leaf: #4cc38f; --line: rgba(255,255,255,.12); }
  }
  :root[data-theme="dark"] { --bg1: #0b1620; --bg2: #1a1420; --card: #16222f; --ink: #2a5a8a; --text: #e8eef5; --muted: #9db0c4; --tobby: #20374f; --lulu: #4a3427; --leaf: #4cc38f; --line: rgba(255,255,255,.12); }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.6; color: var(--text);
    background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
  }
  .view { display: none; min-height: 100%; padding: 32px 22px; flex-direction: column; justify-content: center; align-items: center; gap: 26px; max-width: 560px; margin: 0 auto; }
  .view.on { display: flex; }
  h1 { font-size: 1.55rem; line-height: 1.3; font-weight: 700; margin: 0; width: 100%; max-width: 24ch; text-align: justify; text-align-last: center; hyphens: auto; }
  p { margin: 0; text-align: justify; text-align-last: center; hyphens: auto; }

  .pet { width: 100%; height: 100%; display: block; }
  .face { width: 104px; height: 104px; border-radius: 50%; padding: 10px; flex: none; }
  .face.tobby { background: var(--tobby); }
  .face.lulu { background: var(--lulu); }
  .face.big { width: 150px; height: 150px; padding: 14px; }
  .float { animation: float 3.6s ease-in-out infinite; }
  .float.late { animation-delay: -1.8s; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  .agents { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; }
  .agent { border: 1px solid var(--line); border-radius: 24px; background: var(--card); color: var(--text); font: inherit; cursor: pointer; padding: 22px 14px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; transition: transform .2s ease, box-shadow .2s ease; }
  .agent:hover { transform: translateY(-5px); box-shadow: 0 14px 28px rgba(22,50,79,.16); }
  .agent b { font-size: 1.2rem; font-weight: 800; }
  .agent span { font-size: .88rem; color: var(--muted); }
  .view.on .agent { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
  .view.on .agent:nth-child(2) { animation-delay: .12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }

  .go { background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 13px 52px; font: inherit; font-weight: 700; font-size: 1.1rem; cursor: pointer; text-decoration: none; transition: transform .15s ease; }
  .go:hover { transform: scale(1.04); }
  .ghost { background: transparent; border: 0; color: var(--text); font: inherit; font-size: .95rem; text-decoration: underline; cursor: pointer; }
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--leaf); outline-offset: 3px; }

  #splash { max-width: none; background: #16324f; color: #fff; }
  #splash .go { background: #2f9e6e; }
  #splash p { opacity: .8; font-size: .95rem; max-width: 30ch; }
  #splash .pair { display: flex; gap: 18px; }

  .eq { display: flex; gap: 4px; align-items: flex-end; height: 22px; opacity: .25; transition: opacity .25s; }
  .eq i { width: 5px; height: 6px; border-radius: 3px; background: var(--leaf); }
  body.speaking .eq { opacity: 1; }
  body.speaking .eq i { animation: bar .7s ease-in-out infinite alternate; }
  body.speaking .eq i:nth-child(2) { animation-delay: .15s; } body.speaking .eq i:nth-child(3) { animation-delay: .3s; }
  body.speaking .eq i:nth-child(4) { animation-delay: .1s; } body.speaking .eq i:nth-child(5) { animation-delay: .25s; }
  @keyframes bar { to { height: 22px; } }

  .tool { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: .85rem; cursor: pointer; display: none; z-index: 3; }
  .tool.on { display: block; }
  #mute { right: 12px; } #cfgBtn { left: 12px; }
  #music { right: 12px; top: calc(52px + env(safe-area-inset-top, 0px)); }

  #panel { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 5; }
  #panel.on { display: flex; }
  .box { background: var(--card); color: var(--text); border-radius: 22px; padding: 22px; width: 100%; max-width: 400px; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .box h2 { margin: 0; font-size: 1.2rem; }
  .box label { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); }
  .box select { font: inherit; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg1); color: var(--text); }
  .box input[type=range] { width: 100%; accent-color: var(--leaf); }
  .row { display: flex; gap: 10px; }
  .row .go { padding: 10px 14px; font-size: .95rem; flex: 1; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 380px) { .agents { grid-template-columns: 1fr; } }
</style>

<script>
// ===== Texts: edit them here =====
const GREETING = "Hello Samuel. Which artificial intelligence agent would you like to use today?";
const AGENTS = {
  tobby: { text: "Hey! I’m Tobby, ready to help you prepare your Python Level 2 classes.", say: "Hey! I'm Tobby, ready to help you prepare your Python Level 2 classes.", href: "https://tobby.samue3945.workers.dev/", role: "male", face: "tobby", icon: "puppy" },
  lulu:  { text: "Hi there! I’m Lulu, ready to help you prepare your Python Level 1 classes.", say: "Hi there! I'm Lulu, ready to help you prepare your Python Level 1 classes.", href: "https://lulu.gameplayssamuel2023.workers.dev/", role: "female", face: "lulu", icon: "kitten" }
};
// =================================

const $ = (id) => document.getElementById(id);
const show = (id) => document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id));
const canSpeak = "speechSynthesis" in window;
let voiceOn = true;

let cfg = { male: "", female: "", rate: 0.9, pm: 0.75, pf: 1.15 };
try { Object.assign(cfg, JSON.parse(localStorage.getItem("samuel_voices_en") || "{}")); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem("samuel_voices_en", JSON.stringify(cfg)); } catch (e) {} };

const FEMALE = /\bfemale\b|zira|samantha|aria|jenny|susan|hazel|karen|moira|victoria|tessa|fiona|libby|sonia|emma|ava|allison|michelle|nicole|joanna|salli|kimberly|google us english/i;
const MALE = /\bmale\b|david|mark|guy|ryan|george|james|daniel|alex|fred|aaron|thomas|arthur|brian|christopher|eric|roger|liam|oliver|gordon|matthew|joey/i;
const NATURAL = /natural|neural|online|premium|enhanced|google/i;

function enVoices() {
  if (!canSpeak) return [];
  return speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("en"))
    .sort((a, b) => NATURAL.test(b.name) - NATURAL.test(a.name));
}
function pickVoice(role) {
  const vs = enVoices();
  const saved = cfg[role];
  if (saved) { const f = vs.find(v => v.name === saved); if (f) return f; }
  if (role === "female") return vs.find(v => FEMALE.test(v.name)) || vs[0] || null;
  return vs.find(v => !FEMALE.test(v.name) && MALE.test(v.name)) || vs.find(v => !FEMALE.test(v.name)) || vs[0] || null;
}

function speak(role, text) {
  if (!voiceOn || !canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(role);
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = "en-US"; }
    u.rate = cfg.rate;
    u.pitch = role === "female" ? cfg.pf : cfg.pm;
    u.onstart = () => document.body.classList.add("speaking");
    u.onend = u.onerror = () => { document.body.classList.remove("speaking"); duck(false); };
    duck(true);   // lower the music while a voice talks
    speechSynthesis.speak(u);
  } catch (e) {}
}
const stop = () => { try { if (canSpeak) speechSynthesis.cancel(); } catch (e) {} document.body.classList.remove("speaking"); duck(false); };

$("enter").addEventListener("click", () => {
  show("home");
  $("mute").classList.add("on"); $("cfgBtn").classList.add("on"); $("music").classList.add("on");
  startMusic();
  speak("male", GREETING);
});

document.querySelectorAll(".agent").forEach(btn => btn.addEventListener("click", () => {
  const a = AGENTS[btn.dataset.agent];
  $("introText").textContent = a.text;
  $("introGo").href = a.href;
  $("introFace").className = "face big float " + a.face;
  $("introPet").innerHTML = '<use href="#' + a.icon + '" width="100%" height="100%"/>';
  show("intro");
  speak(a.role, a.say);
}));

$("back").addEventListener("click", () => { stop(); show("home"); });
$("introGo").addEventListener("click", stop);
$("mute").addEventListener("click", () => {
  voiceOn = !voiceOn;
  if (!voiceOn) stop();
  $("mute").textContent = "Voice: " + (voiceOn ? "on" : "off");
});

// ----- Voice settings -----
function fillSelect(sel, role) {
  const vs = enVoices(), cur = pickVoice(role);
  if (!vs.length) { const o = document.createElement("option"); o.textContent = "No English voices on this device"; sel.replaceChildren(o); return; }
  sel.replaceChildren(...vs.map(v => {
    const o = document.createElement("option");
    o.value = v.name; o.textContent = v.name + " (" + v.lang + ")";
    o.selected = !!cur && cur.name === v.name;
    return o;
  }));
}
function fillVoices() { fillSelect($("selM"), "male"); fillSelect($("selF"), "female"); }
if (canSpeak) { speechSynthesis.onvoiceschanged = fillVoices; fillVoices(); }
$("rate").value = cfg.rate; $("pm").value = cfg.pm; $("pf2").value = cfg.pf;
$("cfgBtn").addEventListener("click", () => { fillVoices(); $("panel").classList.add("on"); });
$("closeCfg").addEventListener("click", () => { stop(); $("panel").classList.remove("on"); });
$("selM").addEventListener("change", e => { cfg.male = e.target.value; saveCfg(); });
$("selF").addEventListener("change", e => { cfg.female = e.target.value; saveCfg(); });
$("rate").addEventListener("input", e => { cfg.rate = +e.target.value; saveCfg(); });
$("pm").addEventListener("input", e => { cfg.pm = +e.target.value; saveCfg(); });
$("pf2").addEventListener("input", e => { cfg.pf = +e.target.value; saveCfg(); });
$("testM").addEventListener("click", () => speak("male", "Hey Samuel! This is how Tobby sounds."));
$("testF").addEventListener("click", () => speak("female", "Hi Samuel! This is how Lulu sounds."));

// ----- Music: generated live with Web Audio (no files) -----
const BPM = 112, S16 = 60 / BPM / 4, LEVEL = 0.2, DUCK = 0.035;
const CHORDS = [[57,60,64,69],[53,57,60,65],[60,64,67,72],[55,59,62,67]]; // Am F C G
const BASS = [33,29,36,31], ARP = [0,1,2,3,2,1,2,3];
let AC = null, master = null, delayIn = null, noiseBuf = null;
let musicOn = true, ducked = false, nextT = 0, stepN = 0, timer = null;
const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);

function applyGain() {
  if (!master) return;
  master.gain.setTargetAtTime(!musicOn ? 0 : (ducked ? DUCK : LEVEL), AC.currentTime, 0.25);
}
function duck(on) { ducked = on; applyGain(); }

function tone(type, f, t, a, d, peak, dest, cutoff) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  let out = o;
  if (cutoff) { const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = cutoff; o.connect(lp); out = lp; }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  out.connect(g); g.connect(dest);
  o.start(t); o.stop(t + a + d + 0.05);
}
function kick(t) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
  g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);
}
function hit(t, type, freq, peak, dur) {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
function playStep(n, t) {
  const bar = (n >> 4) & 3, k = n & 15, ch = CHORDS[bar];
  if (k % 4 === 0) kick(t);
  if (k === 4 || k === 12) hit(t, "bandpass", 1900, 0.3, 0.14);
  if (k % 4 === 2) hit(t, "highpass", 7000, 0.2, 0.05); else if (k % 2 === 1) hit(t, "highpass", 8000, 0.06, 0.03);
  if ([0,3,6,8,10,13].indexOf(k) >= 0) tone("sawtooth", midi(BASS[bar]), t, 0.005, S16 * 1.8, 0.26, master, 380);
  tone("square", midi(ch[ARP[k % 8]] + 12), t, 0.004, S16 * 1.4, 0.06, delayIn, 2400);
  if (k === 0) [ch[0], ch[1], ch[2]].forEach(m => tone("triangle", midi(m - 12), t, 0.5, S16 * 14, 0.05, master, 900));
}
function schedule() {
  while (nextT < AC.currentTime + 0.25) { playStep(stepN, nextT); nextT += S16; stepN = (stepN + 1) % 64; }
}
function startMusic() {
  if (AC) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) { $("music").style.display = "none"; return; }
  try {
    AC = new Ctx();
    const comp = AC.createDynamicsCompressor();
    master = AC.createGain(); master.gain.value = 0;
    master.connect(comp); comp.connect(AC.destination);
    delayIn = AC.createGain();
    const dl = AC.createDelay(); dl.delayTime.value = S16 * 3;
    const fb = AC.createGain(); fb.gain.value = 0.35;
    delayIn.connect(master); delayIn.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextT = AC.currentTime + 0.1;
    timer = setInterval(schedule, 60);
    applyGain();
  } catch (e) { AC = null; }
}
$("music").addEventListener("click", () => {
  musicOn = !musicOn;
  $("music").textContent = "Music: " + (musicOn ? "on" : "off");
  if (AC && AC.state === "suspended") AC.resume();
  applyGain();
});
document.addEventListener("visibilitychange", () => {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else AC.resume();
});

</script>
